name: Delivery quality
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: delivery-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  delivery-checks:
    name: delivery-checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: npm ci --prefix automation --ignore-scripts
      - run: npm ci --prefix quality --ignore-scripts
      - run: npm test --prefix automation
      - run: npm test --prefix quality
      - run: node quality/hygiene.mjs
      - run: node quality/check-site.mjs .
      - run: quality/node_modules/.bin/playwright install --with-deps chromium
      - name: Reader smoke
        run: |
          mkdir -p /tmp/india-news-preview
          ln -s "$GITHUB_WORKSPACE" /tmp/india-news-preview/india-news-project
          python3 -m http.server 3121 --bind 127.0.0.1 --directory /tmp/india-news-preview > /tmp/india-news-preview.log 2>&1 &
          QA_BASE_URL=http://127.0.0.1:3121/india-news-project/ node quality/smoke.mjs
