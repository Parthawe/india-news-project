name: Daily news and Pages

on:
  push:
    branches: [main]
  schedule:
    # 08:15 and 14:15 India time. The second run fills gaps, never adds a second five.
    - cron: '45 2,8 * * *'
    # Selected reporting feeds refresh hourly; GitHub scheduling may be delayed.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: india-news-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install collector dependencies
        run: npm ci --prefix automation --ignore-scripts
      - name: Install delivery QA dependencies
        run: npm ci --prefix quality --ignore-scripts
      - name: Test selection and evidence safeguards
        run: npm test --prefix automation
      - name: Collect up to five official updates
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '45 2,8 * * *')
        run: node automation/daily-news.mjs .
      - name: Collect approved reporting feeds
        if: github.event_name != 'push'
        run: node automation/latest-news.mjs .
      - name: Save the daily public archive
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news en/index.html hi/index.html en/latest/index.html hi/latest/index.html en/blindspots/index.html hi/blindspots/index.html en/coverage-gaps/index.html hi/coverage-gaps/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Update dated news links and source collection health'
            git push
          fi
      - name: Validate delivery files
        run: |
          npm test --prefix quality
          node quality/hygiene.mjs
          node quality/check-site.mjs .
      - name: Install browser
        run: quality/node_modules/.bin/playwright install --with-deps chromium
      - name: Smoke test release candidate
        run: |
          mkdir -p /tmp/india-news-preview
          ln -s "$GITHUB_WORKSPACE" /tmp/india-news-preview/india-news-project
          python3 -m http.server 3121 --bind 127.0.0.1 --directory /tmp/india-news-preview > /tmp/india-news-preview.log 2>&1 &
          QA_BASE_URL=http://127.0.0.1:3121/india-news-project/ node quality/smoke.mjs
      - name: Prepare public Pages artifact
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='automation' --exclude='quality' --exclude='ops' --exclude='_site' ./ _site/
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0; compatible artifact lookup
        with:
          path: _site
          retention-days: 1
      - name: Confirm Pages artifact is visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Artifact upload can finish before the Actions listing API sees it.
          for attempt in $(seq 1 15); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')
            if [ "$count" -gt 0 ]; then exit 0; fi
            sleep 3
          done
          echo 'Pages artifact is not visible after upload; stopping deployment.' >&2
          exit 1
      - name: Deploy public website
        id: deployment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const {pathToFileURL} = require('node:url');
            const {deployPages} = await import(pathToFileURL(process.env.GITHUB_WORKSPACE + '/quality/deploy-pages.mjs').href);
            await deployPages({github, context, core});
