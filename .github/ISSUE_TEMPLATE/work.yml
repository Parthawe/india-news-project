name: Product or engineering task
description: A bounded task for the AI workflow
title: '[Task] '
labels: ['status:backlog']
body:
  - type: textarea
    id: problem
    attributes:
      label: Reader or operator problem
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Observable acceptance criteria
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope, exclusions and data permissions
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Expected QA and bilingual states
