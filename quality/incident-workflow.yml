name: Production failure triage
on:
  workflow_run:
    workflows: ['Daily news and Pages']
    types: [completed]
permissions:
  contents: read
  issues: write
jobs:
  triage:
    if: github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' || github.event.workflow_run.conclusion == 'action_required'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Open or update a sanitised incident
        env:
          GH_TOKEN: ${{ github.token }}
        run: node quality/incident.mjs
